<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Slate-Navy Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>

    <!-- Royal Electric Indigo Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Smart Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Ambient Center Halo Glow -->
    <filter id="haloFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Sleek Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)"/>
  
  <!-- Subtle Ambient Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGlow)" stroke-width="4.5" opacity="0.95"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Glowing Center Ambient Spot -->
  <circle cx="256" cy="195" r="105" fill="#4f46e5" opacity="0.28" filter="url(#haloFilter)"/>

  <!-- 3D Official NCERT Emblem Artwork -->
  <g filter="url(#shadowBlur)">
    <image href="/icon-ncert-official-3d.png" x="141" y="70" width="230" height="230" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Clean Separation Divider Accent -->
  <path d="M 176 324 L 336 324" stroke="url(#indigoGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="324" r="3.5" fill="#10b981"/>

  <!-- Brand Typography: NCERT -->
  <text 
    x="256" 
    y="386" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
    font-size="60" 
    font-weight="900" 
    letter-spacing="0.08em" 
    fill="#ffffff"
    filter="drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5))"
  >
    NCERT
  </text>

  <!-- Sub-Branding: by NextSem with Smart Emerald Accent -->
  <text 
    x="256" 
    y="428" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
    font-size="20" 
    font-weight="800" 
    letter-spacing="0.22em" 
    fill="#10b981"
  >
    BY NEXTSEM
  </text>

  <!-- Curriculum Standard Badge Subtitle -->
  <text 
    x="256" 
    y="458" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
    font-size="11.5" 
    font-weight="700" 
    letter-spacing="0.14em" 
    fill="#94a3b8" 
    opacity="0.9"
  >
    NEP 2026 • DIGITAL REPOSITORY
  </text>
</svg>

